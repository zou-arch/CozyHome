name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk wget unzip git libtool libtool-bin automake autoconf m4
        # 验证 libtool m4 宏已安装
        grep -r "LT_SYS_SYMBOL_USCORE" /usr/share/aclocal/ || echo "WARNING: LT_SYS_SYMBOL_USCORE not found in /usr/share/aclocal/"

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0"
        pip install buildozer

    - name: Clean buildozer cache
      run: |
        rm -rf ~/.buildozer/android/platform/

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
