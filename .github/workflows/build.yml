name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk wget unzip git libtool libtool-bin automake autoconf m4
        # 修复 LT_SYS_SYMBOL_USCORE 宏缺失（Ubuntu 24.04 的 libtool 不包含此宏）
        if ! grep -q "LT_SYS_SYMBOL_USCORE" /usr/share/aclocal/libtool.m4 2>/dev/null; then
          echo "下载完整的 libtool.m4..."
          sudo wget -q -O /usr/share/aclocal/libtool.m4 https://raw.githubusercontent.com/autotools-mirror/libtool/master/m4/libtool.m4
          echo "libtool.m4 已更新"
        fi

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0"
        pip install buildozer

    - name: Clean buildozer cache
      run: |
        rm -rf ~/.buildozer/android/platform/

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
